name: seattle-food-trucks
sourceRole: venue
description: "Seattle Food Trucks"
url: "https://www.seattlefoodtruck.com/api/events"
friendlyLink: "https://www.seattlefoodtruck.com"
# 2026-09-12: seattlefoodtruck.com now fronts every /api/* request with a
# Cloudflare JS challenge ("Just a moment..." interstitial), so even a plain
# residential fetch 403s — this is the JS-challenge case that should escalate
# straight to browserbase (see docs/proxy-verification.md). Staged at the
# outofband entry point per the proxy ladder; leave the escalation decision to
# skills/proxy-escalation/SKILL.md (out-of-band run) rather than hand-picking
# browserbase here.
proxy: "outofband"
imageUrl: "https://upload.wikimedia.org/wikipedia/commons/3/3b/Maximus_Minimus_food_truck_Seattle_Washington.JPG"
cost: free
# Each event is a generic "Food Trucks @ <pod>" slot with no per-event image;
# don't queue them in photoGaps (the venue imageUrl above is the intended photo).
skipEventPhotos: true
lookahead: "P30D"
geo: null
calendars:
  # Catch-all feed for Seattle food-truck pods that DON'T have their own per-pod
  # calendar below (skipped breweries pending dedicated rippers, plus any newly
  # appeared pod). Disjoint from the per-pod calendars, so no slot is ever in two
  # calendars (keeps the cross-source dedup from seeing food trucks twice — see
  # buildCalendars in ripper.ts). Also the source anchor (its already-deployed
  # URL keeps the source from registering as "new"). Tagged only "Food" so its
  # events don't double up in the per-pod "FoodTruck" tag aggregate.
  - name: seattle-food-trucks
    friendlyname: "Seattle Food Trucks"
    timezone: America/Los_Angeles
    tags: ["Food"]
  # Per-pod calendars: one public pod each, tagged ["FoodTruck", "<Neighborhood>"],
  # with a fixed geo so the pod appears in venues.json. Most pods below book
  # consistently enough that they don't carry expectEmpty; a handful of lower-
  # volume pods (single-employer corporate campuses, etc.) still set
  # expectEmpty: true because they legitimately have no bookings in a given
  # week. The merged calendar above is the health sentinel for the source
  # either way.
  - name: westlake-center
    friendlyname: "Food Trucks @ Westlake Center"
    timezone: America/Los_Angeles
    tags: ["FoodTruck", "Downtown"]
    geo:
      lat: 47.61142
      lng: -122.3375
      label: "400 Pine St, Seattle, WA 98101"
      osmType: way
      osmId: 36869314
